<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DPP Fragebogen Eco Acoustics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one question per screen, centred column, progress rail + section label on top, nav bottom-right */
/* Layout: one question per screen, centred column; logos + title on top, nav bottom-right. Palette from eco-acoustics.ch */
:root{
  --bg:#EEEAE8; --surface:#FBFAF9; --ink:#22201E; --muted:#6B6560; --line:#D9D3CF;
  --accent:#008FD2; --accent-ink:#0077B0; --accent-soft:#DCEEF8; --on-accent:#FFFFFF; --navy:#2B5672; --logo-filter:none;
  --f-display:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A1917; --surface:#24221F; --ink:#EEEAE8; --muted:#A8A19B; --line:#3A3632;
  --accent:#3DB2EA; --accent-ink:#3DB2EA; --accent-soft:#12354A; --on-accent:#08202E; --navy:#8FB6D0; --logo-filter:invert(1); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A1917; --surface:#24221F; --ink:#EEEAE8; --muted:#A8A19B; --line:#3A3632;
  --accent:#3DB2EA; --accent-ink:#3DB2EA; --accent-soft:#12354A; --on-accent:#08202E; --navy:#8FB6D0; --logo-filter:invert(1); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

.shell{min-height:100%; display:grid; grid-template-rows:auto 1fr auto}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg)}
.rail{height:4px; background:var(--line)}
.rail i{display:block; height:100%; width:0; background:var(--accent); transition:width .35s ease}
.brand{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; flex-wrap:wrap}
.logos{display:flex; align-items:center; gap:12px}
.logo{height:20px; width:auto; filter:var(--logo-filter)}
.logo.eco{height:20px}
.logos .x{color:var(--muted); font-size:14px}
.ttl{display:grid; justify-items:end; gap:2px}
.ttl b{font:600 15px/1.2 var(--f-display)}
.ttl small{font:500 12px var(--f-mono); color:var(--muted)}
@media (max-width:560px){ .ttl{justify-items:start} }

main{display:grid; place-items:center; padding-block:24px 96px; padding-inline:20px}
.stage{width:100%; max-width:680px; min-width:0}
.screen{animation:in .35s ease both}
@keyframes in{from{opacity:.0; transform:translateY(14px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){ .screen{animation:none} .rail i{transition:none} }

.eyebrow{font:500 12px/1.4 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.opt-tag{font:500 10px/1.6 var(--f-mono); letter-spacing:.08em; padding:0 6px; border:1px solid var(--line); border-radius:4px; color:var(--muted)}
.qnum{display:inline-flex; align-items:center; gap:6px; margin-right:6px; color:var(--navy); font:500 15px var(--f-mono)}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,46px); line-height:1.08; font-weight:700}
h2{font-size:clamp(22px,3.4vw,30px); line-height:1.2; font-weight:600}
h3{font-size:16px; font-weight:600; margin-top:22px}
.hint{color:var(--muted); margin:10px 0 0; max-width:60ch}
.lead{font-size:18px; color:var(--muted); max-width:56ch; margin:16px 0 0}
code{font:500 .92em var(--f-mono)}

.opts{display:grid; gap:10px; margin-top:26px; max-width:540px}
.opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer; transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
.key{flex:none; width:26px; height:26px; display:grid; place-items:center; border:1px solid var(--line); border-radius:6px; font:500 12px var(--f-mono); color:var(--muted); background:var(--bg)}
.opt[aria-checked="true"] .key{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--on-accent)}
.opt .t{flex:1; min-width:0}
.opt .t small{display:block; color:var(--muted); font-size:13px}
.opt .pen{font-size:12px; color:var(--muted)}
input.other{width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--accent); border-radius:8px; background:var(--surface); margin-top:-4px}
input.extra{width:100%; max-width:540px; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); margin-top:12px}
input.extra:focus,input.other:focus{border-color:var(--accent); outline:none}

.field{width:100%; max-width:560px; margin-top:26px; border:0; border-bottom:2px solid var(--line); background:transparent; font-size:22px; padding:8px 2px; outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:120px; resize:vertical; font-size:18px; line-height:1.5; border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--surface)}
textarea.field:focus{border-color:var(--accent)}

.grid{display:grid; gap:10px; margin-top:24px}
.gridrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:6px 10px; font-size:13px; cursor:pointer; color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-ink); color:var(--on-accent)}
@media (max-width:600px){ .gridrow{grid-template-columns:1fr} }

.row{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:28px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:9px; border:1px solid var(--accent-ink); background:var(--accent-ink); color:var(--on-accent); font-weight:600; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6; cursor:default}
.enter{font:500 12px var(--f-mono); color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:22px; font-size:14px; color:var(--muted)}
.meta b{color:var(--ink); font-weight:600}
.h1-sub{display:block; font-size:.62em; font-weight:600; color:var(--navy); margin-top:10px; letter-spacing:-.01em}
.chapters{margin-top:28px; max-width:600px}
.chapters h3{margin:0 0 6px; font:500 11px/1.4 var(--f-mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.chapters ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(var(--rows),auto); grid-auto-flow:column; column-gap:28px}
.chapters li{display:flex; align-items:baseline; gap:10px; padding:4px 0; min-width:0; font-size:14px; color:var(--muted)}
.chapters .n{flex:none; width:20px; font:500 12px var(--f-mono); color:var(--muted); opacity:.75}
.chapters .nm{flex:1; min-width:0}
.chapters .c{display:none}
@media (max-width:560px){ .chapters ol{grid-template-columns:1fr; grid-template-rows:none; grid-auto-flow:row}  }

.nav{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; gap:6px; z-index:6}
.nav button{width:42px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink)}
.nav button:disabled{opacity:.35; cursor:default}

.sum{margin-top:8px; display:grid; border-top:1px solid var(--line)}
.sum div{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto; gap:6px 16px; padding:10px 0; border-bottom:1px solid var(--line); align-items:baseline}
.sum .q{font-size:14px; color:var(--muted)}
.sum .a{font-weight:500; overflow-wrap:anywhere}
.sum .a.empty{color:var(--muted); font-weight:400; font-style:italic}
.sum button{border:0; background:none; color:var(--accent-ink); cursor:pointer; font-size:13px; text-decoration:underline}
@media (max-width:600px){ .sum div{grid-template-columns:1fr auto} .sum .a{grid-column:1 / -1; grid-row:2} }
.note{margin-top:16px; padding:10px 12px; border-radius:8px; background:var(--accent-soft); font-size:14px}
pre.copy{white-space:pre-wrap; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:280px; overflow:auto}

footer{padding:14px 120px calc(14px + env(safe-area-inset-bottom,0px)) 20px; font-size:12px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:14px; z-index:9}
</style>
</head>

Q.forEach(q=>{ if(q.opts) q.opts=q.opts.map(x=>typeof x==="string"?{l:x}:x); });

/* ===== Zustand ===== */
const KEY="dpp-fragebogen-v2", LETTERS="ABCDEFGHIJ";
let A=load(), pos=-1, failed=false, sent=false; // pos: -1 Start, 0..n-1 Fragen (sichtbar), n Übersicht, n+1 Danke
const EMBEDDED=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const stage=document.getElementById("stage");
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(A)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const L=x=>typeof x==="string"?x:x.l;
const visible=()=>Q.filter(q=>!q.when||q.when());
function ans(q){ return A[q.id]||(A[q.id]={}); }

function answerText(q){
  const a=A[q.id]; if(!a) return "";
  const withT=l=> a.t&&a.t[l] ? `${l} (${a.t[l]})` : l;
  let out="";
  if(q.type==="single") out = a.v ? withT(a.v) : "";
  if(q.type==="multi") out = (a.v||[]).map(withT).join(", ");
  if(q.type==="short"||q.type==="long") out = a.x||"";
  if(q.type==="grid") out = q.rows.map((r,k)=>a.m&&a.m[k]?`${r}: ${a.m[k]}`:"").filter(Boolean).join("; ");
  if(q.extra && a.x && q.type!=="short" && q.type!=="long") out += (out?" · ":"")+a.x;
  return out;
}

/* ===== Rendering ===== */
function render(){
  const V=visible(), n=V.length;
  document.getElementById("rail").style.width = (pos<0?0:Math.min(100,Math.min(pos,n)/n*100))+"%";
  const q=V[pos];
  document.getElementById("count").textContent = (pos>=0&&pos<n) ? `Thema ${q.s+1}/${S.length} · Frage ${pos+1}/${n}` : "";
  document.getElementById("prev").disabled = pos<=-1 || pos>n;
  document.getElementById("next").disabled = pos>=n;
  document.getElementById("nav").hidden = pos<0 || pos>n;
  if(pos<0) return welcome();
  if(pos===n) return summary();
  if(pos>n) return thanks();
  question(q, pos+1, n);
}

function welcome(){
  const started=Object.keys(A).length>0;
  stage.innerHTML=`<div class="screen">
    <div class="eyebrow">Digital Product Passport · Fundament</div>
    <h1>Hoi Sebas 👋<span class="h1-sub">Anbei ein paar Fragen für die Produktpässe</span></h1>
    <p class="lead">Mit deinen Antworten lege ich das Fundament für die Pässe: von der Herstellung über Pflege und Reparatur bis zum Recycling. Fast alles geht per Klick und kurzem Text-Input. Wenn du etwas nicht weisst, einfach weiterklicken. Alle offenen Themen können wir persönlich oder in einem Call klären. 🙌🏼</p>
    <div class="meta"><span>⏱ <b>ca. 15 Min.</b></span><span>🧩 <b>${S.length} Kapitel</b></span><span>📅 bis <b>${esc(CONFIG.deadline)}</b></span></div>
    <div class="chapters"><h3>Kapitel</h3><ol style="--rows:${Math.ceil(S.length/2)}">${S.map((s,k)=>{const c=Q.filter(q=>q.s===k&&!q.when).length;return `<li${k===0||k===Math.ceil(S.length/2)?' class="colstart"':""}><span class="n">${String(k+1).padStart(2,"0")}</span><span class="nm">${esc(s)}</span><span class="c">${c} ${c===1?"Frage":"Fragen"}</span></li>`;}).join("")}</ol></div>
    <div class="row"><button class="btn" id="go" type="button">Let's begin!</button><span class="enter">oder Enter ↵</span></div>
  </div>`;
  document.getElementById("go").onclick=()=>go(started?firstOpen():0);
  document.getElementById("go").focus({preventScroll:true});
}
function firstOpen(){ const V=visible(); const k=V.findIndex(q=>!answerText(q)); return k<0?V.length:k; }

function question(q, num, n){
  const a=A[q.id]||{};
  let body="";
  if(q.type==="single"||q.type==="multi"){
    const sel = q.type==="single" ? (a.v?[a.v]:[]) : (a.v||[]);
    body=`<div class="opts" role="${q.type==="single"?"radiogroup":"group"}" aria-label="${esc(q.title)}">`+
      q.opts.map((op,k)=>{ const l=L(op), on=sel.includes(l);
        return `<button type="button" class="opt" role="${q.type==="single"?"radio":"checkbox"}" data-k="${k}" aria-checked="${on}"><span class="key">${LETTERS[k]}</span><span class="t">${esc(l)}${op.sub?`<small>${esc(op.sub)}</small>`:""}</span>${op.txt?`<span class="pen">✎</span>`:""}</button>`+
          (op.txt?`<input class="other" id="t-${k}" data-t="${esc(l)}" placeholder="${esc(op.txt)}" value="${esc((a.t&&a.t[l])||"")}" aria-label="${esc(l)}: ${esc(op.txt)}"${on?"":" hidden"}>`:"");
      }).join("")+`</div>`+
      (q.extra?`<input class="extra" id="extra" placeholder="${esc(q.extra)}" value="${esc(a.x||"")}" aria-label="${esc(q.extra)}">`:"");
  }
  if(q.type==="short") body=`<input class="field" id="txt" placeholder="${esc(q.ph||"")}" value="${esc(a.x||"")}" aria-label="${esc(q.title)}">`;
  if(q.type==="long") body=`<textarea class="field" id="txt" placeholder="${esc(q.ph||"")}" aria-label="${esc(q.title)}">${esc(a.x||"")}</textarea>`;
  if(q.type==="grid"){ const m=a.m||{};
    body=`<div class="grid">`+q.rows.map((r,k)=>`<div class="gridrow"><span>${esc(r)}</span><span class="seg" role="group" aria-label="${esc(r)}">${q.cols.map(c=>`<button type="button" data-r="${k}" data-c="${esc(c)}" aria-pressed="${m[k]===c}">${esc(c)}</button>`).join("")}</span></div>`).join("")+`</div>`; }
  const hintKeys = q.type==="long" ? "Shift + Enter für neue Zeile" : (q.type==="single"||q.type==="multi") ? `Tasten A–${LETTERS[q.opts.length-1]} oder Enter ↵` : "oder Enter ↵";
  stage.innerHTML=`<div class="screen">
    <div class="eyebrow"><span>${q.s+1} · ${esc(S[q.s])}</span>${q.optional?`<span class="opt-tag">OPTIONAL</span>`:""}</div>
    <h2><span class="qnum">${num} →</span>${esc(q.title)}</h2>
    ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
    ${body}
    <div class="row"><button class="btn" id="ok" type="button">${num===n?"Zur Übersicht":"Weiter"} ✓</button><span class="enter">${hintKeys}</span></div>
  </div>`;
  bind(q);
}

function bind(q){
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(q,+b.dataset.k));
  stage.querySelectorAll("input.other").forEach(inp=>inp.oninput=()=>{ const a=ans(q); a.t=a.t||{}; a.t[inp.dataset.t]=inp.value; save(); });
  const ex=document.getElementById("extra"); if(ex) ex.oninput=()=>{ ans(q).x=ex.value; save(); };
  const txt=document.getElementById("txt");
  if(txt){ txt.oninput=()=>{ ans(q).x=txt.value; save(); }; setTimeout(()=>txt.focus({preventScroll:true}),60); }
  stage.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ const a=ans(q); a.m=a.m||{}; const k=b.dataset.r;
    a.m[k] = a.m[k]===b.dataset.c ? undefined : b.dataset.c; save();
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(a.m[k]===x.dataset.c))); });
  document.getElementById("ok").onclick=()=>go(pos+1);
}

function pick(q,k){
  const op=q.opts[k], l=L(op), a=ans(q);
  if(q.type==="single"){
    a.v = a.v===l ? "" : l; save();
    stage.querySelectorAll(".opt").forEach((b,j)=>b.setAttribute("aria-checked", String(L(q.opts[j])===a.v)));
    stage.querySelectorAll("input.other").forEach(inp=>inp.hidden = inp.dataset.t!==a.v);
    if(a.v && op.txt){ const inp=stage.querySelector(`input.other[data-t="${CSS.escape(l)}"]`); if(inp) inp.focus(); }
    else if(a.v && !q.extra) setTimeout(()=>{ if(stage.querySelector(".opt")) go(pos+1); }, 320);
    else if(a.v && q.extra) document.getElementById("extra").focus();
  } else {
    const s=new Set(a.v||[]); s.has(l)?s.delete(l):s.add(l); a.v=[...s]; save();
    stage.querySelectorAll(".opt").forEach((b,j)=>b.setAttribute("aria-checked", String(a.v.includes(L(q.opts[j])))));
    stage.querySelectorAll("input.other").forEach(inp=>inp.hidden = !a.v.includes(inp.dataset.t));
    if(op.txt && a.v.includes(l)){ const inp=stage.querySelector(`input.other[data-t="${CSS.escape(l)}"]`); if(inp) inp.focus(); }
  }
}

function summary(){
  const V=visible(); const open=V.filter(q=>!answerText(q)&&!q.optional).length;
  let html="", last=-1;
  V.forEach((q,k)=>{ if(q.s!==last){ if(last>=0) html+=`</div>`; html+=`<h3>${q.s+1} · ${esc(S[q.s])}</h3><div class="sum">`; last=q.s; }
    const a=answerText(q);
    html+=`<div><span class="q">${k+1}. ${esc(q.title)}</span><span class="a${a?"":" empty"}">${a?esc(a):(q.optional?"übersprungen":"offen")}</span><button type="button" data-edit="${k}">Ändern</button></div>`; });
  html+=`</div>`;
  stage.innerHTML=`<div class="screen">
    <div class="eyebrow">Übersicht</div>
    <h2>Fast geschafft. Passt alles?</h2>
    <p class="hint">${open?`${open} Frage${open>1?"n sind":" ist"} noch offen. Das ist ok, wir klären sie im Call.`:"Alle Fragen beantwortet. Merci!"}</p>
    ${html}
    <div class="row"><button class="btn" id="send" type="button">Antworten senden →</button></div>
  </div>`;
  stage.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>go(+b.dataset.edit));
  document.getElementById("send").onclick=send;
}

function plain(){
  const V=visible(); let out="", last=-1;
  V.forEach((q,k)=>{ if(q.s!==last){ out+=`\n== ${q.s+1} ${S[q.s]} ==\n`; last=q.s; } out+=`${k+1}. ${q.title}\n   ${answerText(q)||"(offen)"}\n`; });
  return out.trim();
}

async function send(){
  const btn=document.getElementById("send"); btn.disabled=true; btn.textContent="Wird gesendet …";
  failed=false;
  const canSend = !EMBEDDED && (CONFIG.backend==="netlify" || (CONFIG.backend==="web3forms" && !/DEIN_/.test(CONFIG.web3formsKey)));
  if(canSend){
    try{
      if(CONFIG.backend==="web3forms"){
        const data={access_key:CONFIG.web3formsKey, subject:CONFIG.subject, from_name:"DPP Fragebogen"};
        visible().forEach((q,k)=>{ data[`${String(k+1).padStart(2,"0")} ${q.title}`]=answerText(q)||"(offen)"; });
        const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
        const j=await r.json().catch(()=>({})); if(!r.ok||j.success===false) throw new Error("send");
      } else {
        const body=new URLSearchParams({"form-name":"dpp-fragebogen", antworten:plain(), json:JSON.stringify(A)});
        const r=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()});
        if(!r.ok) throw new Error("send");
      }
      sent=true;
    }catch(e){ failed=true; }
  }
  pos=visible().length+1; render();
}

function thanks(){
  const preview = !sent && !failed;
  stage.innerHTML=`<div class="screen">
    <div class="eyebrow">Fragebogen abgeschlossen</div>
    <h1>Herzlichen Dank, Sebas</h1>
    ${failed?`<div class="note"><b>Das Senden hat gerade nicht geklappt.</b> Kopiere deine Antworten bitte mit dem Knopf unten und füge sie in deine Antwort-Mail ein.</div>`:""}
    <p class="lead">${failed?"Deine Antworten sind auf diesem Gerät gespeichert.":"Deine Antworten sind versendet worden."} Bitte schicke mir noch die erwähnten Dokumente, wenn möglich per Mail.</p>
    <p class="lead">Ich melde mich spätestens für den Abklärungscall in ${esc(CONFIG.callWeek)}. 😊 Blessings! 🕊️</p>
    ${preview?`<div class="note"><b>Vorschau-Hinweis (nur für dich sichtbar):</b> In dieser Vorschau wird nichts gesendet. In der gehosteten Version gehen die Antworten automatisch an dich.</div>`:""}
    <div class="row"><button class="btn ghost" id="cp" type="button">Antworten kopieren</button><button class="btn ghost" id="back" type="button">Zurück zur Übersicht</button></div>
    <pre class="copy" id="plain" tabindex="0" hidden>${esc(plain())}</pre>
  </div>`;
  document.getElementById("back").onclick=()=>go(visible().length);
  document.getElementById("cp").onclick=()=>{
    const pre=document.getElementById("plain"); pre.hidden=false;
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Markiert: mit Cmd+C / Strg+C kopieren"); };
    try{ navigator.clipboard.writeText(plain()).then(()=>toast("Antworten kopiert"), sel); }catch(e){ sel(); }
  };
}

function go(n){ pos=Math.max(-1, Math.min(n, visible().length+1)); render(); window.scrollTo({top:0}); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }

document.getElementById("prev").onclick=()=>go(pos-1);
document.getElementById("next").onclick=()=>go(pos+1);
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase(), V=visible();
  if(e.key==="Enter"){
    if(tag==="textarea" && e.shiftKey) return;
    if(tag==="button") return;
    if(pos<0){ e.preventDefault(); return document.getElementById("go").click(); }
    if(pos>=0 && pos<V.length){ e.preventDefault(); return go(pos+1); }
  }
  if(tag==="input"||tag==="textarea"||e.metaKey||e.ctrlKey||e.altKey) return;
  if(pos>=0 && pos<V.length){
    const q=V[pos]; const k=LETTERS.indexOf(e.key.toUpperCase());
    if((q.type==="single"||q.type==="multi") && k>=0 && k<q.opts.length){ e.preventDefault(); pick(q,k); }
  }
});
render();
})();
</script>
